services:
  - type: web
    name: trading-bot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn screener.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SCHWAB_APP_KEY
        sync: false
      - key: SCHWAB_APP_SECRET
        sync: false
      - key: SCHWAB_TOKEN_JSON
        sync: false
      - key: SCHWAB_CALLBACK_URL
        value: https://127.0.0.1:8182
      - key: SCHWAB_TOKEN_PATH
        value: .cache/schwab_token.json
      - key: DATA_PROVIDER
        value: schwab
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANALYSIS_PROVIDER
        value: gemini
      # Google Search grounding is not free-tier eligible on Gemini (returns
      # 429 RESOURCE_EXHAUSTED); keep this false unless on a paid Gemini
      # plan or using ANALYSIS_PROVIDER=anthropic instead.
      - key: ANALYSIS_WEB_SEARCH
        value: "false"

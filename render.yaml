services:
  - type: web
    name: trading-bot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn screener.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SCHWAB_APP_KEY
        sync: false
      - key: SCHWAB_APP_SECRET
        sync: false
      - key: SCHWAB_TOKEN_JSON
        sync: false
      - key: SCHWAB_CALLBACK_URL
        value: https://127.0.0.1:8182
      - key: SCHWAB_TOKEN_PATH
        value: .cache/schwab_token.json
      - key: DATA_PROVIDER
        value: schwab

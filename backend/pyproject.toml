[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.10",
    "asteval>=1.0.9",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "pandas>=3.0.3",
    "pandas-ta>=0.4.71b0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "reportlab>=4.2",
    "schwab-py>=1.5.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.34.0",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "hatchling>=1.30.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as requiring network access (deselect with -m 'not integration')",
]

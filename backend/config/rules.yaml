schedule:
  "on": "0 16 * * 1-5"
  timezone: "America/New_York"

rules:
  - name: big_tech_or_chip
    weight: 2.0
    condition: "in_watchlist or is_chip"
  - name: oversold_band
    weight: 2.0
    condition: "rsi(14) > 25 and rsi(14) < 40"
  - name: quality_uptrend
    weight: 1.5
    condition: "close > sma(200)"
  - name: near_52w_low
    weight: 1.0
    condition: "close <= low_52w(252) * 1.15"
  - name: undervalued_pb
    weight: 1.5
    condition: "price_to_book < 4"

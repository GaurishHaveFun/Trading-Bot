schedule:
  "on": "0 16 * * 1-5"
  timezone: "America/New_York"

rules:
  - name: big_tech_or_chip
    weight: 2.0
    condition: "in_watchlist or is_chip"
    description: "A major technology or semiconductor company — the kind this screener focuses on."
  - name: oversold_band
    weight: 2.0
    condition: "rsi(14) > 25 and rsi(14) < 40"
    description: "The stock has fallen enough recently to look potentially cheap (RSI between 25 and 40)."
  - name: quality_uptrend
    weight: 1.5
    condition: "close > sma(200)"
    description: "Trading above its long-term (200-day) average price — a sign of a healthy uptrend."
  - name: near_52w_low
    weight: 1.0
    condition: "close <= low_52w(252) * 1.15"
    description: "Trading close to its lowest price of the past year (within 15% of the 52-week low)."
  - name: undervalued_pb
    weight: 1.5
    condition: "price_to_book < 4"
    description: "Priced cheaply relative to the company's book value (price-to-book under 4)."
